name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (fmt + clippy + unit/contract + postgres integration)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gw
          POSTGRES_PASSWORD: gw
          POSTGRES_DB: gw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gw -d gw_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # 仅 gated 测试使用；普通测试不依赖数据库
      GW_TEST_DATABASE_URL: postgres://gw:gw@127.0.0.1:5432/gw_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # 单元测试 + OpenAPI 契约 lint（contract_tests）
      - run: cargo test --all-targets
      # Postgres 集成测试 + HTTP 契约测试；串行避免共享测试库互相 truncate
      - run: cargo test --all-targets -- --ignored --test-threads=1

  license:
    name: license policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check dependency licenses
        working-directory: server
        run: cargo deny check licenses

  web:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r build
