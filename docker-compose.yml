# 本地开发用 PostgreSQL；账号密码为固定弱口令，生产环境请使用独立凭据并开启网络隔离。
name: ai-gateway

services:
  postgres:
    image: postgres:16-alpine
    container_name: gw-postgres
    environment:
      POSTGRES_USER: gw
      POSTGRES_PASSWORD: gw
      POSTGRES_DB: gw
    ports:
      - "5432:5432"
    volumes:
      - gw-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gw -d gw"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gw-pgdata:
