openapi: 3.1.0
x-module: access
x-status: design-v0.2
info:
  title: AI Gateway - Access API
  version: 0.2.0
  description: |
    员工设备与虚拟 Key（access）管理台 + 客户端接入 API 契约。语义说明见同目录的 接口设计.md。

    约定：
    - 管理台：identity `gw_admin_session` Cookie + `X-CSRF-Token`。
    - 客户端：配对码 / device_secret 换 token / Bearer token。
    - 所有响应带 `x-request-id` 与 `Cache-Control: no-store`。
    - 明文配对码/device_secret/api_key/token 只在创建响应返回一次，列表/详情不返回。
    - 错误统一 `application/problem+json`，带稳定 `code`。
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发
tags:
  - name: access-admin
    description: 管理台配对码/设备/Key 管理
  - name: access-client
    description: 客户端配对、token 交换与设备信息
paths:
  /api/admin/users:
    get:
      tags: [access-admin]
      operationId: listUsers
      summary: 员工用户列表
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/UserStatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 用户分页列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [access-admin]
      operationId: updateUser
      summary: 更新用户显示名/状态（禁用即时失效）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
      responses:
        '200':
          description: 更新后的用户
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/pairing-codes:
    get:
      tags: [access-admin]
      operationId: listPairingCodes
      summary: 配对码元数据列表（不含明文）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/PairingStatusFilter'
        - $ref: '#/components/parameters/UserIdFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 配对码分页列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCodePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    post:
      tags: [access-admin]
      operationId: createPairingCode
      summary: 生成一次性配对码（明文只返回一次）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePairingCodeRequest'
            examples:
              default:
                value:
                  user_email: alice@corp.example.com
                  user_display_name: Alice
                  expires_in_seconds: 600
      responses:
        '201':
          description: 生成成功（code 只出现一次；同用户未用旧码失效）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePairingCodeResponse'
              examples:
                created:
                  value:
                    pairing_code:
                      id: 0f8a5dd0-7d6f-4b7e-9f8e-2d0f5b7a6c11
                      code: 7Q2M-9XKD
                      status: active
                      expires_at: "2026-10-30T01:45:00Z"
                      used_at: null
                      invalidated_at: null
                      created_at: "2026-10-30T01:35:00Z"
                      user:
                        id: 1b2c3d4e-5f60-4718-9a0b-1c2d3e4f5a6b
                        email: alice@corp.example.com
                        display_name: Alice
                        status: active
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/pairing-codes/{pairingCodeId}:
    parameters:
      - $ref: '#/components/parameters/PairingCodeId'
    delete:
      tags: [access-admin]
      operationId: invalidatePairingCode
      summary: 失效配对码（幂等）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已失效
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/devices:
    get:
      tags: [access-admin]
      operationId: listDevices
      summary: 设备列表
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceStatusFilter'
        - $ref: '#/components/parameters/UserIdFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 设备分页列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [access-admin]
      operationId: getDevice
      summary: 设备详情（含 Key/活跃 token 概览）
      security:
        - adminSession: []
      responses:
        '200':
          description: 设备详情
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetail'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    patch:
      tags: [access-admin]
      operationId: updateDevice
      summary: 更新设备名/状态（禁用即时失效）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDeviceRequest'
      responses:
        '200':
          description: 更新后的设备
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    delete:
      tags: [access-admin]
      operationId: unbindDevice
      summary: 解绑设备（禁用 + 吊销 Key，幂等）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已解绑
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/keys:
    get:
      tags: [access-admin]
      operationId: listVirtualKeys
      summary: 虚拟 Key 列表（仅前缀）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/KeyStatusFilter'
        - $ref: '#/components/parameters/UserIdFilter'
        - $ref: '#/components/parameters/DeviceIdFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Key 分页列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/keys/{keyId}:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    get:
      tags: [access-admin]
      operationId: getVirtualKey
      summary: Key 详情（仅前缀）
      security:
        - adminSession: []
      responses:
        '200':
          description: Key 详情
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyAdmin'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    patch:
      tags: [access-admin]
      operationId: updateVirtualKey
      summary: 更新 Key 白名单/过期时间
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchKeyRequest'
      responses:
        '200':
          description: 更新后的 Key
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    delete:
      tags: [access-admin]
      operationId: revokeVirtualKey
      summary: 吊销 Key（幂等，立即生效）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已吊销
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/keys/{keyId}/reset:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    post:
      tags: [access-admin]
      operationId: resetVirtualKey
      summary: 重置 Key（旧 Key 立即失效，新明文只返回一次）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 新 Key（明文一次）+ Key 元数据
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetKeyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/client/pair:
    post:
      tags: [access-client]
      operationId: pairDevice
      summary: 用配对码注册设备并领取凭证（明文只返回一次）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientPairRequest'
            examples:
              default:
                value:
                  code: 7Q2M-9XKD
                  device:
                    name: Alice 的 MacBook
                    platform: macos
                    client_version: 0.1.0
      responses:
        '201':
          description: 配对成功（device_secret/api_key/token 只此一次）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPairResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/PairingInvalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/client/token:
    post:
      tags: [access-client]
      operationId: exchangeDeviceToken
      summary: 用 device_secret 换短期 device_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: 新 token
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidDeviceCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/client/device:
    get:
      tags: [access-client]
      operationId: getClientDevice
      summary: 当前设备信息（Bearer device_token）
      security:
        - clientToken: []
      responses:
        '200':
          description: 设备/用户/Key 摘要（无明文）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDeviceResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/user-groups:
    get:
      tags: [access-admin]
      operationId: listUserGroups
      summary: 用户组分页列表
      security:
        - adminSession: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 用户组分页
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserGroupSummary'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    post:
      tags: [access-admin]
      operationId: createUserGroup
      summary: 创建用户组（名称唯一）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserGroupRequest'
      responses:
        '201':
          description: 创建成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroupDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/user-groups/{userGroupId}:
    parameters:
      - name: userGroupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [access-admin]
      operationId: getUserGroup
      summary: 用户组详情（含成员）
      security:
        - adminSession: []
      responses:
        '200':
          description: 用户组详情
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroupDetail'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    patch:
      tags: [access-admin]
      operationId: updateUserGroup
      summary: 更新用户组（member_ids 出现即全量替换）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserGroupRequest'
      responses:
        '200':
          description: 更新后的用户组
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroupDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    delete:
      tags: [access-admin]
      operationId: deleteUserGroup
      summary: 删除用户组（幂等，级联成员）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已删除
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: gw_admin_session
      description: identity 登录后下发的 HttpOnly Session Cookie
    clientToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: POST /api/client/token 返回的 device_token
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: identity 登录或 /me 返回的 CSRF token（43 字符）
      schema:
        type: string
        minLength: 43
        maxLength: 43
    PairingCodeId:
      name: pairingCodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, disabled]
    UserIdFilter:
      name: user_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    DeviceIdFilter:
      name: device_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    PairingStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, used, expired, invalidated]
    DeviceStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, disabled]
    KeyStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, paused, revoked]
  headers:
    NoStore:
      description: 凭证/设备数据不能被缓存
      schema:
        type: string
        example: no-store
    RequestId:
      description: 请求 ID，与服务端日志关联
      schema:
        type: string
        example: 0f8a5dd0-7d6f-4b7e-9f8e-2d0f5b7a6c11
  responses:
    BadRequest:
      description: 字段/请求体校验失败
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            validation_failed:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: validation_failed
                detail: 请求参数不合法
                errors:
                  user_email: 邮箱格式不正确
    NotAuthenticated:
      description: 未登录/Session 过期/client token 无效
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not_authenticated:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: not_authenticated
                detail: 请先登录
            invalid_device_token:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: invalid_device_token
                detail: 设备 token 无效或已过期；请重新换取 token
    InvalidDeviceCredentials:
      description: device_id 与 device_secret 不匹配或设备不存在
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid_device_credentials:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: invalid_device_credentials
                detail: 设备凭证无效
    PairingInvalid:
      description: 配对码不存在/过期/已用/已失效（统一错误）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            pairing_code_invalid:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: pairing_code_invalid
                detail: 配对码无效、已过期或已被使用
    CsrfInvalid:
      description: CSRF token 缺失或不正确
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            csrf_invalid:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: csrf_invalid
                detail: CSRF token 不正确或已过期
    Forbidden:
      description: 用户/设备被禁用
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            user_disabled:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: user_disabled
                detail: 该用户已被禁用
            device_disabled:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: device_disabled
                detail: 该设备已被禁用或解绑
    NotFound:
      description: 对象不存在
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            pairing_code_not_found:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: pairing_code_not_found
                detail: 配对码记录不存在
            device_not_found:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: device_not_found
                detail: 设备不存在
            key_not_found:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: key_not_found
                detail: 虚拟 Key 不存在
            user_not_found:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: user_not_found
                detail: 员工用户不存在
    Conflict:
      description: 资源冲突（如用户组名称已存在）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            user_group_name_conflict:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: user_group_name_conflict
                detail: 用户组名称已存在
    TooManyAttempts:
      description: 配对/token 交换失败次数超限
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          description: 建议等待秒数（剩余窗口，最小 60）
          schema:
            type: integer
            minimum: 60
          example: 60
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            too_many_attempts:
              value:
                type: about:blank
                title: Too Many Requests
                status: 429
                code: too_many_attempts
                detail: 尝试过于频繁，请稍后再试
    DatabaseUnavailable:
      description: 数据库不可用
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            database_unavailable:
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
                code: database_unavailable
                detail: 数据库暂不可用
    InternalError:
      description: 未预期错误（不返回内部细节）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal_error:
              value:
                type: about:blank
                title: Internal Server Error
                status: 500
                code: internal_error
                detail: 服务器内部错误，请稍后重试并提供 x-request-id
  schemas:
    User:
      type: object
      required: [id, email, display_name, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 64
        status:
          type: string
          enum: [active, disabled]
    UserPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer
    PatchUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          maxLength: 64
        status:
          type: string
          enum: [active, disabled]
    PairingCode:
      type: object
      required: [id, user, status, expires_at, used_at, invalidated_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        status:
          type: string
          enum: [active, used, expired, invalidated]
        expires_at:
          type: string
          format: date-time
        used_at:
          type: [string, 'null']
          format: date-time
        invalidated_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
    PairingCodePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PairingCode'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer
    CreatePairingCodeRequest:
      type: object
      additionalProperties: false
      required: [user_email]
      properties:
        user_email:
          type: string
          format: email
          maxLength: 254
        user_display_name:
          type: string
          maxLength: 64
        expires_in_seconds:
          type: integer
          minimum: 60
          maximum: 1800
          default: 600
    CreatePairingCodeResponse:
      type: object
      required: [pairing_code]
      properties:
        pairing_code:
          allOf:
            - $ref: '#/components/schemas/PairingCode'
            - type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 8
                  maxLength: 9
                  description: 配对码明文（Crockford base32，显示 XXXX-XXXX，仅此一次）
    DeviceKeySummary:
      type: object
      required: [id, key_prefix, status, expires_at]
      properties:
        id:
          type: string
          format: uuid
        key_prefix:
          type: string
          maxLength: 16
        status:
          type: string
          enum: [active, paused, revoked]
        expires_at:
          type: [string, 'null']
          format: date-time
    DeviceAdmin:
      type: object
      required: [id, user, name, platform, client_version, status, online, last_seen_at, last_ip, key, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        name:
          type: string
          maxLength: 64
        platform:
          type: string
          maxLength: 32
        client_version:
          type: string
          maxLength: 32
        status:
          type: string
          enum: [active, disabled]
        online:
          type: boolean
        last_seen_at:
          type: [string, 'null']
          format: date-time
        last_ip:
          type: string
        key:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/DeviceKeySummary'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DeviceDetail:
      allOf:
        - $ref: '#/components/schemas/DeviceAdmin'
        - type: object
          required: [active_token_count, last_token_expires_at]
          properties:
            active_token_count:
              type: integer
              minimum: 0
            last_token_expires_at:
              type: [string, 'null']
              format: date-time
    DevicePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeviceAdmin'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer
    PatchDeviceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 64
        status:
          type: string
          enum: [active, disabled]
    KeyAdmin:
      type: object
      required: [id, key_prefix, status, user, device, allowed_models, rpm_limit, expires_at, last_used_at, revoked_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        key_prefix:
          type: string
          maxLength: 16
        status:
          type: string
          enum: [active, paused, revoked]
        user:
          $ref: '#/components/schemas/User'
        device:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        allowed_models:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 100
        rpm_limit:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000000
          description: 每分钟请求上限；null=不限
        expires_at:
          type: [string, 'null']
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    KeyPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KeyAdmin'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer
    PatchKeyRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        allowed_models:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 100
        rpm_limit:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000000
          description: 缺省=不改；null=清除；设置后 proxy 429 key_rate_limited
        expires_at:
          type: [string, 'null']
          format: date-time
    UserGroupSummary:
      type: object
      required: [id, name, description, member_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 200
        member_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserGroupDetail:
      allOf:
        - $ref: '#/components/schemas/UserGroupSummary'
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/User'
    CreateUserGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 200
          default: ''
        member_ids:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
    UpdateUserGroupRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: [string, 'null']
          maxLength: 200
        member_ids:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
    ResetKeyResponse:
      type: object
      required: [api_key, key]
      properties:
        api_key:
          type: string
          description: 新 Key 明文（仅此一次）
        key:
          $ref: '#/components/schemas/KeyAdmin'
    ClientPairRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        device:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 64
            platform:
              type: string
              maxLength: 32
            client_version:
              type: string
              maxLength: 32
    ClientPairResponse:
      type: object
      required: [device, user, device_secret, api_key, api_key_prefix, token, token_type, token_expires_at]
      properties:
        device:
          type: object
          required: [id, name, platform, status, created_at]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            platform:
              type: string
            status:
              type: string
              enum: [active, disabled]
            created_at:
              type: string
              format: date-time
        user:
          $ref: '#/components/schemas/User'
        device_secret:
          type: string
          description: 设备密钥明文（仅此一次，客户端存系统钥匙串）
        api_key:
          type: string
          description: 虚拟 Key 明文（仅此一次）
        api_key_prefix:
          type: string
        token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        token_expires_at:
          type: string
          format: date-time
    TokenRequest:
      type: object
      additionalProperties: false
      required: [device_id, device_secret]
      properties:
        device_id:
          type: string
          format: uuid
        device_secret:
          type: string
          minLength: 1
          maxLength: 128
    TokenResponse:
      type: object
      description: device_token TTL 900s（15 分钟）
      required: [token, token_type, expires_at, device_id]
      properties:
        token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
        device_id:
          type: string
          format: uuid
    ClientDeviceResponse:
      type: object
      required: [device, user, key]
      properties:
        device:
          type: object
          required: [id, name, platform, client_version, status, last_seen_at]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            platform:
              type: string
            client_version:
              type: string
            status:
              type: string
              enum: [active, disabled]
            last_seen_at:
              type: [string, 'null']
              format: date-time
        user:
          $ref: '#/components/schemas/User'
        key:
          type: object
          required: [id, key_prefix, status, expires_at, allowed_models]
          properties:
            id:
              type: string
              format: uuid
            key_prefix:
              type: string
            status:
              type: string
              enum: [active, paused, revoked]
            expires_at:
              type: [string, 'null']
              format: date-time
            allowed_models:
              type: array
              items:
                type: string
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: 稳定错误码，前端按它处理
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
          description: 字段名 → 可读错误（仅 400 validation_failed）
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: string
