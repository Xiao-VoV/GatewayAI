openapi: 3.1.0
x-module: catalog
x-status: implemented-v0.1
info:
  title: AI Gateway - Catalog (Model Group / Deployment / Publication) API
  version: 0.1.0
  description: |
    模型目录（catalog）机器契约：上游模型 → 部署 → 模型组 → 发布 → 客户端已发布目录。

    约定：
    - 管理台 `/api/admin/*`：identity `gw_admin_session` Cookie + `X-CSRF-Token`（写）。
    - 客户端 `/v1/models*`：数据面鉴权 = 虚拟 Key（`Authorization: Bearer`）+ 设备令牌
      （`X-GW-Device-Token`），HTTP owner = catalog（proxy 不注册该路由）。
    - 客户端响应只含已发布且可见的模型，**不含 canonical/价格/供应商/账号/allowed**。
    - 所有响应 `x-request-id` + `Cache-Control: no-store`；客户端目录额外 `x-gw-catalog-version`。
    - 语义权威：同目录 `接口设计.md` / `技术设计.md` / `数据库设计.md`。
    - S4 过渡：`GET /v1/models` 由 catalog handler 委托 routing 投影（版本 `routing:<n>`）；
      `GET /v1/models/{id}` 在 S4 返回 501，v0.1.x 起生效。
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发
tags:
  - name: catalog-admin
    description: 管理台：模型组/部署/聚合建议/发布/工具默认/员工目录预览
  - name: catalog-client
    description: 客户端数据面：已发布模型目录
paths:
  /api/admin/model-groups:
    get:
      tags: [catalog-admin]
      operationId: listModelGroups
      summary: 模型组分页列表
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/ModelGroupStatusFilter'
        - $ref: '#/components/parameters/CanonicalFilter'
        - $ref: '#/components/parameters/QueryFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 模型组分页
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelGroupPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    post:
      tags: [catalog-admin]
      operationId: createModelGroup
      summary: 创建模型组（可选携带初始部署）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelGroupCreateRequest'
            examples:
              minimal:
                value:
                  client_model_name: deepseek-chat
                  canonical: deepseek-chat
              with_deployment:
                value:
                  client_model_name: claude-sonnet-4-5
                  display_name: Claude Sonnet 4.5
                  canonical: claude-sonnet-4-5
                  capabilities: [chat, stream, tools]
                  context_window: 200000
                  max_output: 8192
                  protocols: [openai_chat, anthropic_messages]
                  status: active
                  deployments:
                    - upstream_model_id: 33333333-3333-3333-3333-333333333333
                      provider_account_id: 22222222-2222-2222-2222-222222222222
                      priority: 1
                      weight: 100
                      enabled: true
      responses:
        '201':
          description: 创建成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelGroupAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/model-groups/{modelGroupId}:
    parameters:
      - $ref: '#/components/parameters/ModelGroupId'
    get:
      tags: [catalog-admin]
      operationId: getModelGroup
      summary: 模型组详情（含部署/发布/告警）
      security:
        - adminSession: []
      responses:
        '200':
          description: 模型组详情
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelGroupAdmin'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    patch:
      tags: [catalog-admin]
      operationId: updateModelGroup
      summary: 更新模型组字段/状态（激活需至少一个启用部署）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelGroupUpdateRequest'
            examples:
              activate:
                value:
                  status: active
              update_capabilities:
                value:
                  capabilities: [chat, stream, tools, vision]
                  context_window: 200000
      responses:
        '200':
          description: 更新后的模型组
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelGroupAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    delete:
      tags: [catalog-admin]
      operationId: deleteModelGroup
      summary: 归档模型组（软删除，幂等 204；恢复用 PATCH status）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已归档（不存在也 204）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/model-groups/{modelGroupId}/route-preview:
    parameters:
      - $ref: '#/components/parameters/ModelGroupId'
    get:
      tags: [catalog-admin]
      operationId: previewModelGroupRoutes
      summary: 路由候选确定性预览（不调用上游、不消耗随机性）
      security:
        - adminSession: []
      responses:
        '200':
          description: 候选与告警
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelGroupRoutePreview'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/deployments:
    get:
      tags: [catalog-admin]
      operationId: listDeployments
      summary: 部署分页列表（含 providers 实时状态富化）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/ModelGroupIdQuery'
        - $ref: '#/components/parameters/UpstreamModelIdQuery'
        - $ref: '#/components/parameters/ProviderIdQuery'
        - $ref: '#/components/parameters/ProviderAccountIdQuery'
        - $ref: '#/components/parameters/EnabledFilter'
        - $ref: '#/components/parameters/UngroupedFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 部署分页
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    post:
      tags: [catalog-admin]
      operationId: createDeployment
      summary: 创建部署（上游模型 × 渠道账号；可入组或暂不归属）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentCreateRequest'
            examples:
              ungrouped:
                value:
                  upstream_model_id: 33333333-3333-3333-3333-333333333334
                  provider_account_id: 22222222-2222-2222-2222-222222222223
              grouped:
                value:
                  upstream_model_id: 33333333-3333-3333-3333-333333333333
                  provider_account_id: 22222222-2222-2222-2222-222222222222
                  model_group_id: 44444444-4444-4444-4444-444444444444
                  priority: 1
                  weight: 100
                  enabled: true
      responses:
        '201':
          description: 创建成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/deployments/{deploymentId}:
    parameters:
      - $ref: '#/components/parameters/DeploymentId'
    get:
      tags: [catalog-admin]
      operationId: getDeployment
      summary: 部署详情
      security:
        - adminSession: []
      responses:
        '200':
          description: 部署详情
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentAdmin'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    patch:
      tags: [catalog-admin]
      operationId: updateDeployment
      summary: 更新部署（权重/优先级/启停/入组或移出组）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentUpdateRequest'
            examples:
              disable:
                value:
                  enabled: false
              attach:
                value:
                  model_group_id: 44444444-4444-4444-4444-444444444444
              detach:
                value:
                  model_group_id: null
      responses:
        '200':
          description: 更新后的部署
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    delete:
      tags: [catalog-admin]
      operationId: deleteDeployment
      summary: 删除部署（物理删除，204 幂等；建议先停用）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已删除（不存在也 204）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/model-group-suggestions:
    get:
      tags: [catalog-admin]
      operationId: listMergeSuggestions
      summary: 聚合建议列表（实时计算；已拒绝指纹被抑制）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CanonicalFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 建议分页（按 first_seen_at 升序，最多 200 条）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeSuggestionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/model-group-suggestions/{suggestionKey}/confirm:
    parameters:
      - $ref: '#/components/parameters/SuggestionKey'
    post:
      tags: [catalog-admin]
      operationId: confirmMergeSuggestion
      summary: 确认聚合建议（新建模型组或并入既有组，幂等）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmMergeSuggestionRequest'
            examples:
              create_group:
                value:
                  action: create_group
                  client_model_name: claude-sonnet-4-5
                  display_name: Claude Sonnet 4.5
              merge_into_group:
                value:
                  action: merge_into_group
                  target_group_id: 44444444-4444-4444-4444-444444444444
      responses:
        '200':
          description: 合并结果（重复确认返回既有结果）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeConfirmation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/model-group-suggestions/{suggestionKey}/reject:
    parameters:
      - $ref: '#/components/parameters/SuggestionKey'
    post:
      tags: [catalog-admin]
      operationId: rejectMergeSuggestion
      summary: 拒绝聚合建议（保持独立，留决策审计，幂等）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectMergeSuggestionRequest'
            examples:
              variant_mismatch:
                value:
                  note: 版本不同，保持独立
      responses:
        '200':
          description: 拒绝结果（重复拒绝幂等返回）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeRejection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/publications:
    get:
      tags: [catalog-admin]
      operationId: listPublications
      summary: 发布分页列表
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/ModelGroupIdQuery'
        - $ref: '#/components/parameters/PublicationStatusFilter'
        - $ref: '#/components/parameters/SubjectTypeFilter'
        - $ref: '#/components/parameters/SubjectIdFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 发布分页
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    post:
      tags: [catalog-admin]
      operationId: createPublication
      summary: 创建发布（一模型组一条；含发布对象/配额/数据等级配置面）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationCreateRequest'
            examples:
              all_users:
                value:
                  model_group_id: 44444444-4444-4444-4444-444444444444
                  targets:
                    - subject_type: all_users
                      visible: true
                      allowed: true
              mixed_targets:
                value:
                  model_group_id: 44444444-4444-4444-4444-444444444444
                  data_level_max: 2
                  quota_rpm: 60
                  quota_tpm: 200000
                  quota_daily_requests: 5000
                  note: 研发部主模型
                  targets:
                    - subject_type: user
                      subject_id: 99999999-9999-9999-9999-999999999999
                      visible: true
                      allowed: true
      responses:
        '201':
          description: 创建成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/publications/{publicationId}:
    parameters:
      - $ref: '#/components/parameters/PublicationId'
    get:
      tags: [catalog-admin]
      operationId: getPublication
      summary: 发布详情（含对象清单与 enforcement 标注）
      security:
        - adminSession: []
      responses:
        '200':
          description: 发布详情
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationAdmin'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    patch:
      tags: [catalog-admin]
      operationId: updatePublication
      summary: 更新发布/暂停恢复/全量替换发布对象
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationUpdateRequest'
            examples:
              pause:
                value:
                  status: paused
              replace_targets:
