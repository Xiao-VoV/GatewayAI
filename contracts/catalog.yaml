        context_window:
          type: [integer, 'null']
        max_output:
          type: [integer, 'null']
        capabilities:
          type: array
          items:
            type: string
    RelatedGroup:
      type: object
      required: [id, client_model_name, status]
      properties:
        id:
          type: string
          format: uuid
        client_model_name:
          type: string
        status:
          type: string
          enum: [draft, active, archived]
    DiffValue:
      type: object
      required: [deployment_id, value]
      properties:
        deployment_id:
          type: string
          format: uuid
        value:
          type: string
    DiffItem:
      type: object
      required: [field, risk_flag, values, note]
      properties:
        field:
          type: string
        risk_flag:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/DiffValue'
        note:
          type: string
    MergeSuggestion:
      type: object
      required:
        - suggestion_key
        - canonical
        - upstream_model_name
        - recommendation
        - deployment_count
        - provider_count
        - deployments
        - related_groups
        - diff
        - risk_flags
        - first_seen_at
      properties:
        suggestion_key:
          type: string
          pattern: '^[a-f0-9]{32}$'
        canonical:
          type: string
        upstream_model_name:
          type: string
        recommendation:
          type: string
          enum: [merge, keep_separate]
        deployment_count:
          type: integer
          minimum: 2
        provider_count:
          type: integer
          minimum: 1
        deployments:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/SuggestionDeployment'
        related_groups:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/RelatedGroup'
        diff:
          type: array
          items:
            $ref: '#/components/schemas/DiffItem'
        risk_flags:
          type: array
          items:
            type: string
        first_seen_at:
          type: string
          format: date-time
    MergeSuggestionPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              maxItems: 200
              items:
                $ref: '#/components/schemas/MergeSuggestion'
    ConfirmMergeSuggestionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [create_group, merge_into_group]
        client_model_name:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$'
        display_name:
          type: string
          maxLength: 128
        target_group_id:
          type: string
          format: uuid
    MergeConfirmation:
      type: object
      required:
        - suggestion_key
        - decision
        - group
        - moved_deployment_ids
        - decided_at
        - decided_by
      properties:
        suggestion_key:
          type: string
        decision:
          type: string
          enum: [merged]
        group:
          $ref: '#/components/schemas/ModelGroupAdmin'
        moved_deployment_ids:
          type: array
          items:
            type: string
            format: uuid
        decided_at:
          type: string
          format: date-time
        decided_by:
          type: [string, 'null']
          format: uuid
    RejectMergeSuggestionRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 500
    MergeRejection:
      type: object
      required: [suggestion_key, decision, note, decided_at, decided_by]
      properties:
        suggestion_key:
          type: string
        decision:
          type: string
          enum: [rejected]
        note:
          type: string
          maxLength: 500
        decided_at:
          type: string
          format: date-time
        decided_by:
          type: [string, 'null']
          format: uuid
    PreviewSubject:
      type: object
      required:
        - user_id
        - email
        - display_name
        - user_status
        - device_id
        - device_name
        - key_id
        - key_allowed_models
        - user_group_ids
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        user_status:
          type: string
          enum: [active, disabled]
        device_id:
          type: [string, 'null']
          format: uuid
        device_name:
          type: [string, 'null']
        key_id:
          type: [string, 'null']
          format: uuid
        key_allowed_models:
          type: array
          items:
            type: string
        user_group_ids:
          type: array
          description: v0.1.x 恒空（access 用户组预留）
          items:
            type: string
            format: uuid
    ClientModel:
      type: object
      required:
        - id
        - object
        - created
        - owned_by
        - display_name
        - upstream_model
        - capabilities
        - context_window
        - max_output
        - protocols
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$'
        object:
          type: string
          enum: [model]
        created:
          type: integer
          minimum: 0
          description: unix 秒
        owned_by:
          type: string
          enum: [gateway]
        display_name:
          type: string
        upstream_model:
          type: [string, 'null']
        capabilities:
          type: array
          items:
            type: string
        context_window:
          type: [integer, 'null']
        max_output:
          type: [integer, 'null']
        protocols:
          type: array
          items:
            type: string
            enum: [openai_chat, anthropic_messages, openai_responses, gemini_generate_content]
    AdminPreviewModel:
      allOf:
        - $ref: '#/components/schemas/ClientModel'
        - type: object
          required: [visible, allowed, matched_by, publication_id]
          properties:
            visible:
              type: boolean
            allowed:
              type: boolean
            matched_by:
              type: [string, 'null']
              enum: [all_users, user, user_group, application, device, null]
            publication_id:
              type: [string, 'null']
              format: uuid
    AdminPreviewToolDefault:
      type: object
      required: [tool_key, scope_type, source, default_model, switchable_models, warnings]
      properties:
        tool_key:
          type: string
        scope_type:
          type: string
          enum: [global, user_group, user]
        source:
          type: string
          enum: [global, user_group, user, none]
        default_model:
          type: [string, 'null']
        switchable_models:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    AdminCatalogPreview:
      type: object
      required: [catalog_version, subject, models, tool_defaults, enforcement, warnings]
      properties:
        catalog_version:
          type: string
        subject:
          $ref: '#/components/schemas/PreviewSubject'
        models:
          type: array
          description: 与客户端投影同形 + visible/allowed/matched_by 诊断字段（不含价格/供应商/canonical）
          items:
            $ref: '#/components/schemas/AdminPreviewModel'
        tool_defaults:
          type: array
          items:
            $ref: '#/components/schemas/AdminPreviewToolDefault'
        enforcement:
          $ref: '#/components/schemas/Enforcement'
        warnings:
          type: array
          items:
            type: string
    ClientCatalogList:
      type: object
      required: [object, data, catalog_version]
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClientModel'
        catalog_version:
          type: string
          example: 'cat:42'
    ClientModelDetail:
      allOf:
        - $ref: '#/components/schemas/ClientModel'
        - type: object
          required: [parameters, catalog_version]
          properties:
            parameters:
              type: object
              additionalProperties: true
              description: 参数/协议兼容提示（管理员配置，客户端只读）
            catalog_version:
              type: string
