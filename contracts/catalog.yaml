      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/ToolKeyFilter'
        - $ref: '#/components/parameters/ScopeTypeFilter'
        - $ref: '#/components/parameters/ScopeIdFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 工具默认分页
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolModelDefaultPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    post:
      tags: [catalog-admin]
      operationId: createToolModelDefault
      summary: 创建工具默认模型（global/user；user_group 预留）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolModelDefaultCreateRequest'
            examples:
              global_claude_code:
                value:
                  tool_key: claude_code
                  scope_type: global
                  scope_id: null
                  default_model_group_id: 44444444-4444-4444-4444-444444444444
                  allow_switch: true
                  allowed_model_group_ids:
                    - 55555555-5555-5555-5555-555555555555
      responses:
        '201':
          description: 创建成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolModelDefaultAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/tool-model-defaults/{toolDefaultId}:
    parameters:
      - $ref: '#/components/parameters/ToolDefaultId'
    patch:
      tags: [catalog-admin]
      operationId: updateToolModelDefault
      summary: 更新工具默认/切换开关/全量替换白名单
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolModelDefaultUpdateRequest'
            examples:
              disable_switch:
                value:
                  allow_switch: false
              replace_whitelist:
                value:
                  allow_switch: true
                  allowed_model_group_ids:
                    - 55555555-5555-5555-5555-555555555555
      responses:
        '200':
          description: 更新后的工具默认
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolModelDefaultAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    delete:
      tags: [catalog-admin]
      operationId: deleteToolModelDefault
      summary: 删除工具默认模型（204 幂等）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已删除（不存在也 204）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/admin/catalog/preview:
    get:
      tags: [catalog-admin]
      operationId: previewAdminCatalog
      summary: 员工作业目录预览（按用户/设备/Key 投影，含诊断；不含价格/供应商）
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/UserIdQuery'
        - $ref: '#/components/parameters/DeviceIdQuery'
        - $ref: '#/components/parameters/KeyIdQuery'
      responses:
        '200':
          description: 投影结果与诊断
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCatalogPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /v1/models:
    get:
      tags: [catalog-client]
      operationId: listClientModels
      summary: 客户端已发布模型目录（只投影 visible）
      description: |
        S4 过渡期：catalog handler 委托 routing 投影，`catalog_version = routing:<n>`；
        v0.1.x：发布投影，`catalog_version = cat:<n>`。报文形状两阶段一致（v0.1.x 只增字段）。
      security:
        - virtualKey: []
          deviceToken: []
      responses:
        '200':
          description: 可见模型列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-GW-Catalog-Version:
              $ref: '#/components/headers/CatalogVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCatalogList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '403':
          $ref: '#/components/responses/ClientForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /v1/models/{modelId}:
    parameters:
      - $ref: '#/components/parameters/ClientModelId'
    get:
      tags: [catalog-client]
      operationId: getClientModel
      summary: 客户端模型详情（参数/协议兼容标注；S4 过渡期 501）
      description: |
        v0.1.x 起生效：id 为客户端模型名；不可见/不存在统一 404 model_not_found（不泄露草稿/归档）。
      security:
        - virtualKey: []
          deviceToken: []
      responses:
        '200':
          description: 模型详情
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-GW-Catalog-Version:
              $ref: '#/components/headers/CatalogVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientModelDetail'
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '403':
          $ref: '#/components/responses/ClientForbidden'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /v1/model-defaults:
    get:
      tags: [catalog-client]
      operationId: listClientModelDefaults
      summary: 客户端每工具默认模型（只含可见且可调用）
      description: |
        数据面鉴权（Key + device token）；返回 tool_defaults_for 的客户端投影：
        default_model 为客户端模型名，switchable_models 仅 visible+allowed；
        不返回 scope/白名单 UUID/价格/供应商/warnings。空列表 200。
      security:
        - virtualKey: []
          deviceToken: []
      responses:
        '200':
          description: 每工具默认模型列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-GW-Catalog-Version:
              $ref: '#/components/headers/CatalogVersion'
          content:
            application/json:
              schema:
                type: object
                required: [object, data, catalog_version]
                properties:
                  object:
                    type: string
                    const: list
                  data:
                    type: array
                    items:
                      type: object
                      required: [tool_key, default_model, allow_switch, switchable_models]
                      properties:
                        tool_key:
                          type: string
                        default_model:
                          type: string
                        allow_switch:
                          type: boolean
                        switchable_models:
                          type: array
                          items:
                            type: string
                  catalog_version:
                    type: string
        '401':
          $ref: '#/components/responses/ClientUnauthorized'
        '403':
          $ref: '#/components/responses/ClientForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: gw_admin_session
      description: identity 登录后下发的 HttpOnly Session Cookie
    virtualKey:
      type: apiKey
      in: header
      name: Authorization
      description: '虚拟 Key：`Bearer sk-gw-...`（access 数据面鉴权）'
    deviceToken:
      type: apiKey
      in: header
      name: X-GW-Device-Token
      description: access 设备短期 token（与 Key 必须属于同一设备）
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: identity 登录或 /me 返回的 CSRF token（43 字符）
      schema:
        type: string
        minLength: 43
        maxLength: 43
    ModelGroupId:
      name: modelGroupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ToolDefaultId:
      name: toolDefaultId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SuggestionKey:
      name: suggestionKey
      in: path
      required: true
      description: 聚合建议指纹（sha256 前 32 hex）
      schema:
        type: string
        pattern: '^[a-f0-9]{32}$'
    ClientModelId:
      name: modelId
      in: path
      required: true
      description: 客户端模型名（模型组 client_model_name）
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    ModelGroupStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [draft, active, archived]
    CanonicalFilter:
      name: canonical
      in: query
      required: false
      description: canonical 精确匹配（≤100）
      schema:
        type: string
        maxLength: 100
    QueryFilter:
      name: q
      in: query
      required: false
      description: 客户端模型名/展示名子串（≤64，不区分大小写）
      schema:
        type: string
        maxLength: 64
    ModelGroupIdQuery:
      name: model_group_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    UpstreamModelIdQuery:
      name: upstream_model_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    ProviderIdQuery:
      name: provider_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    ProviderAccountIdQuery:
      name: provider_account_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    EnabledFilter:
      name: enabled
      in: query
      required: false
      schema:
        type: boolean
    UngroupedFilter:
      name: ungrouped
      in: query
      required: false
      description: 仅返回未归属模型组的部署（聚合候选）
      schema:
        type: boolean
    PublicationStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, paused]
    SubjectTypeFilter:
      name: subject_type
      in: query
      required: false
      schema:
        type: string
        enum: [all_users, user, user_group, application, device]
    SubjectIdFilter:
      name: subject_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    ToolKeyFilter:
      name: tool_key
      in: query
      required: false
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{0,63}$'
    ScopeTypeFilter:
      name: scope_type
      in: query
      required: false
      schema:
        type: string
        enum: [global, user_group, user]
    ScopeIdFilter:
      name: scope_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    UserIdQuery:
      name: user_id
      in: query
      required: true
      description: 预览目标员工
      schema:
        type: string
        format: uuid
    DeviceIdQuery:
      name: device_id
      in: query
      required: false
      description: 可选：按设备投影（device 发布对象仅预留）
      schema:
        type: string
        format: uuid
    KeyIdQuery:
      name: key_id
      in: query
      required: false
      description: 可选：按该用户的 Key 白名单进一步过滤
      schema:
        type: string
        format: uuid
  headers:
    RequestId:
      description: 请求 ID，与服务端日志关联
      schema:
        type: string
        example: 0f8a5dd0-7d6f-4b7e-9f8e-2d0f5b7a6c11
    NoStore:
      description: 目录/配置响应不允许缓存
      schema:
        type: string
        example: no-store
    CatalogVersion:
      description: 目录版本（cat:<n>；S4 过渡期 routing:<n>）
      schema:
        type: string
        example: 'cat:42'
  responses:
    BadRequest:
      description: JSON/字段/业务前置校验失败
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            validation_failed:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: validation_failed
                detail: 请求参数不合法
                errors:
                  client_model_name: '只允许字母数字与 . _ : -，且不能以符号开头'
            no_enabled_deployment:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: no_enabled_deployment
                detail: 模型组至少需要一个启用的部署才能激活/发布
            model_group_not_ready:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: model_group_not_ready
                detail: 模型组未就绪（需 active 且至少一个启用部署）
            deployment_provider_mismatch:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: deployment_provider_mismatch
                detail: 上游模型与渠道账号必须属于同一供应商
            canonical_mismatch:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: canonical_mismatch
                detail: 部署上游模型的 canonical 与模型组不一致
            model_group_not_active:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: model_group_not_active
                detail: 模型组状态不允许该操作（工具默认需 active；部署不可入组 archived 组）
            target_type_not_supported:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: target_type_not_supported
                detail: 该发布对象类型 v0.1.x 预留（仅支持 all_users / user）
            unsupported_scope:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: unsupported_scope
                detail: 该工具默认作用域 v0.1.x 预留（仅支持 global / user）
            suggestion_not_mergeable:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: suggestion_not_mergeable
                detail: 该建议为「保持独立」（版本/变体不同），不能确认合并
    NotAuthenticated:
      description: 未登录/Session 过期
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not_authenticated:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: not_authenticated
                detail: 请先登录
    CsrfInvalid:
      description: CSRF token 缺失或不正确
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            csrf_invalid:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: csrf_invalid
                detail: CSRF token 不正确或已过期
    NotFoundProblem:
      description: 对象不存在或客户端模型不可见
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            model_group_not_found:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: model_group_not_found
                detail: 模型组不存在
            deployment_not_found:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: deployment_not_found
                detail: 部署不存在
            publication_not_found:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: publication_not_found
                detail: 发布不存在
            tool_model_default_not_found:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: tool_model_default_not_found
                detail: 工具默认模型不存在
            suggestion_not_found:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: suggestion_not_found
                detail: 聚合建议不存在或已失效，请刷新列表
            upstream_model_not_found:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: upstream_model_not_found
                detail: 上游模型不存在
            provider_account_not_found:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: provider_account_not_found
                detail: 渠道账号不存在
            user_not_found:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: user_not_found
                detail: 员工用户不存在
            device_not_found:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: device_not_found
                detail: 设备不存在
            key_not_found:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: key_not_found
                detail: Key 不存在或不属于该用户
            model_not_found:
              value:
                type: about:blank
                title: Not Found
                status: 404
                code: model_not_found
                detail: 模型不存在或未发布给当前用户
    ConflictProblem:
      description: 唯一冲突/发布 1:1/建议失效
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            client_model_name_conflict:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: client_model_name_conflict
                detail: 客户端模型名已被占用
            deployment_conflict:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: deployment_conflict
                detail: 该上游模型在该账号下已有部署
            publication_conflict:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: publication_conflict
                detail: 该模型组已有发布（一个模型组只能有一条发布）
            tool_model_default_conflict:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: tool_model_default_conflict
                detail: 该工具在该作用域已有默认模型
            suggestion_stale:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: suggestion_stale
                detail: 建议的部署集合已变化，请刷新后重试
    InternalError:
      description: 未预期错误
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal_error:
              value:
                type: about:blank
                title: Internal Server Error
                status: 500
                code: internal_error
                detail: 服务器内部错误，请稍后重试并提供 x-request-id
    DatabaseUnavailable:
      description: 数据库/依赖不可用
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            database_unavailable:
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
                code: database_unavailable
                detail: 数据库暂不可用
    ClientUnauthorized:
      description: 数据面 Key/设备令牌无效
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid_api_key:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: invalid_api_key
                detail: Key 无效或不存在
            invalid_device_token:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: invalid_device_token
                detail: 设备令牌无效或已过期
            key_revoked:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: key_revoked
                detail: Key 已吊销
            key_expired:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: key_expired
                detail: Key 已过期
            key_device_mismatch:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: key_device_mismatch
                detail: Key 与设备令牌不属于同一设备
    ClientForbidden:
      description: 数据面用户/设备禁用
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            user_disabled:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: user_disabled
                detail: 用户已被禁用
            device_disabled:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: device_disabled
                detail: 设备已被禁用
    NotImplemented:
      description: 计划中端点（S4 过渡期 /v1/models/{id}）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
